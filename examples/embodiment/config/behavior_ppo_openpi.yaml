defaults:
  - env/behavior_r1pro@env.train
  - env/behavior_r1pro@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null 
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/
    
cluster:
  num_nodes: 2
  
  component_placement:
    actor:
      node_group: a800
      placement: 0  # All 8 A800 GPUs on node 1
    env:
      node_group: 4090
      placement: 1  # Both 4090 GPUs on node 0
    rollout:
      node_group: 4090
      placement: 2  # All 8 A800 GPUs on node 1
  # total_num_envs ≥ rollout × pipeline_stage_num，且 rollout % env == 0，且 total_num_envs 能被 lcm(actor, rollout × pipeline_stage_num) 整除。
  node_groups:
    - label: 4090
      node_ranks: 0  # Node 0 has 2x 4090 GPUs
      env_configs:
        - node_ranks: 0
          env_vars:
            - ISAAC_PATH: "/mnt/public/quanlu/isaac-sim"
            - OMNIGIBSON_DATA_PATH: "/mnt/public/quanlu/BEHAVIOR-1K-datasets"
            - EXP_PATH: "/mnt/public/quanlu/isaac-sim/apps"
            - CARB_APP_PATH: "/mnt/public/quanlu/isaac-sim/kit"
    - label: a800
      node_ranks: 1  # Node 1 has 8x A800 GPUs
      env_configs:
        - node_ranks: 1
          env_vars:
            - ISAAC_PATH: "/mnt/public/quanlu/isaac-sim"
            - OMNIGIBSON_DATA_PATH: "/mnt/public/quanlu/BEHAVIOR-1K-datasets"
            - EXP_PATH: "/mnt/public/quanlu/isaac-sim/apps"
            - CARB_APP_PATH: "/mnt/public/quanlu/isaac-sim/kit"

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "behavior_ppo_openpi_comet"
    logger_backends: ["wandb"] # wandb, swanlab

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  eval_policy_path: null # Optional: .pt file or None, if None, will use the checkpoint in rollout.model.model_path
  val_check_interval: -1
  save_interval: 40
  seq_length: 4096
  max_prompt_length: 50

  resume_dir: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl  # how to estimate kl divergence: kl or kl_penalty
  group_size: 1
  rollout_epoch: 1
  eval_rollout_epoch: 1 # set eval_rollout_epoch > 0 when enable runner.only_eval or runner.val_check_interval > 0

  reward_type: chunk_level
  logprob_type: token_level
  entropy_type: token_level

  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0


  gamma: 0.99
  gae_lambda: 0.95

  # params for rollout
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0

  # length argument for autoregressive sampling
  # max length means max amount of tokens to generate
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

# env:
#   group_name: "EnvGroup"
#   enable_offload: False

#   # Override the default values in env/behavior_r1pro
#   train:
#     total_num_envs: 4
#     max_episode_steps: 2000 # max episode steps for truncation
#     max_steps_per_rollout_epoch: 2000
#   eval:
#     total_num_envs: 4
#     max_episode_steps: 2000 # max episode steps for truncation
#     max_steps_per_rollout_epoch: 2000
#     video_cfg:
#       save_video: True
#       video_base_dir: ${runner.logger.log_path}/video/eval

env:
  group_name: "EnvGroup"
  enable_offload: False

  # Override the default values in env/behavior_r1pro
  train:
    total_num_envs: 1
    max_episode_steps: 2048 # max episode steps for truncation
    max_steps_per_rollout_epoch: 2048
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/train
  eval:
    total_num_envs: 1
    max_episode_steps: 2048 # max episode steps for truncation
    max_steps_per_rollout_epoch: 2048
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: "/mnt/public/chenjiawei/projects/models/openpi_comet/pi05-b1kpt12-cs32"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 2
  global_batch_size: 64
  seed: 42
  enable_offload: True

  # Override the default values in model/openvla_oft
  # model:
  #   model_path: "/mnt/public/chenjiawei/projects/models/openpi_comet/pi05-b1kpt12-cs32"
  #   model_type: "openvla_oft"
  #   value_type: ${algorithm.reward_type}
  #   action_dim: 23
  #   unnorm_key: behavior_turn_on_radio
  #   add_value_head: True
  #   num_images_in_input: 3

  model:
    model_path: "/mnt/public/chenjiawei/projects/models/openpi_comet/pi05-b1kpt12-cs32"
    add_value_head: True
    num_images_in_input: 3
    num_action_chunks: 32
    action_dim: 23
    # num_steps: 10 # todo: to align with default openpi eval
    openpi:
      config_name: "pi05_behavior"
      detach_critic_input: True
      joint_logprob: False
      noise_level: 0.5
      action_env_dim: ${actor.model.action_dim}
      noise_method: "flow_sde"

  optim:
    lr: 1.0e-4
    value_lr: 3.0e-3
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-05
    clip_grad: 10.0
    weight_decay: 0.01
    critic_warmup_steps: 0

  # Override the default values in training_backend/fsdp
  fsdp_config:
    strategy: "fsdp"
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False


env_type: behavior
total_num_envs: null
auto_reset: False
ignore_terminations: False
use_rel_reward: True
seed: 0
group_size: 1
use_fixed_reset_state_ids: False
max_steps_per_rollout_epoch: 2000
max_episode_steps: 2000 # max episode steps for truncation

image_size: [224, 224]

video_cfg:
  save_video: True
  info_on_video: True
  video_base_dir: ${runner.logger.log_path}/video/train

# base_config_name: r1pro_behavior

task_idx: 0 # 0-49, for now, we only support single task training

# ============================================================
# 任务实例加载配置（与 openpi-comet eval_custom.py 对齐）
# ============================================================
# 是否在 reset 时加载特定的任务实例
use_task_instances: True
# 任务实例 ID 列表，用于训练时随机选择
# 如果为 null，则使用所有可用的训练实例 (0-199)
# 如果指定，则只使用指定的实例
task_instance_ids: [109, 139, 181, 187, 197, 203, 211, 214, 242, 295]
# 每个 episode reset 时是否随机选择任务实例
# True: 随机选择（训练用）
# False: 顺序选择（测试/评估用）
random_task_instance: False
